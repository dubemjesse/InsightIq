# Render Blueprint for InsightIQ — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render will provision all
# three services below. After the first deploy, set the secret env vars
# marked `sync: false` in the Render dashboard (they are intentionally not
# committed to the repo).
databases:
  - name: insightiq-postgres
    plan: free
    databaseName: insightiq
    user: insightiq

services:
  - type: web
    name: insightiq-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: insightiq-postgres
          property: connectionString
      - key: CLIENT_URL
        value: https://insightiq-client.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Must be exactly 64 hex characters (32 bytes) — Render's generateValue
      # doesn't guarantee that shape, so set this manually in the dashboard:
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: InsightIQ <no-reply@insightiq.app>
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 25
    disk:
      name: insightiq-uploads
      mountPath: /app/uploads
      sizeGB: 1

  - type: web
    name: insightiq-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    plan: free
    dockerBuildArgs:
      VITE_API_URL: https://insightiq-server.onrender.com/api
